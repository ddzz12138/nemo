name: Build and verify Windows candidate

on:
  pull_request:
    paths: ['app/**', '.github/workflows/windows-candidate.yml']
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/windows-candidate.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nemo-windows-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
      - name: Install locked build dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix desktop/interface --ignore-scripts --no-audit --no-fund
      - name: Prepare interface and test browsers
        run: |
          npm run desktop:interface:build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run desktop:bootstrap
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx --no-install playwright install chromium
      - name: Audit public source
        run: npm run check:source -- --tracked
      - name: Acquire and verify pinned public runtime
        run: npm run desktop:prepare:candidate
      - name: Require real runtime, MCP, native and browser execution
        run: npm run test:release
      - name: Check syntax and sealed runtime
        run: |
          npm run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run desktop:verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run package:release
      - name: Prove Squirrel packaging without distributing the diagnostic installer
        run: npm run desktop:make
      # No installer artifact/upload step: this read-only build is technical
      # verification, not a signed candidate or permission to hand off to a tester.

  signed-draft:
    needs: verify-build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'ddzz12138/nemo'
    runs-on: windows-2025
    timeout-minutes: 45
    environment: windows-candidate
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    env:
      DEBUG: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
      - name: Require configured trusted signing access
        env:
          SIGNING_PFX: ${{ secrets.NEMO_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.NEMO_SIGNING_PASSWORD }}
          EXPECTED_THUMBPRINT: ${{ vars.NEMO_SIGN_EXPECTED_THUMBPRINT }}
        run: |
          if (-not $env:SIGNING_PFX -or -not $env:SIGNING_PASSWORD -or $env:EXPECTED_THUMBPRINT -notmatch '^[a-fA-F0-9]{40}$') { throw 'Configure an eligible trusted signing identity before a candidate can be created. No unsigned handoff is allowed.' }
      - name: Rebuild exact reviewed revision and test all mandatory paths
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix desktop/interface --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run desktop:interface:build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run desktop:bootstrap
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx --no-install playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run check:source -- --tracked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run desktop:prepare:candidate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:release
      - name: Materialize the supplied signing identity in runner temporary storage
        env:
          SIGNING_PFX: ${{ secrets.NEMO_SIGNING_PFX_BASE64 }}
        run: |
          $nemoCertificate = Join-Path $env:RUNNER_TEMP ('nemo-signing-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '.pfx')
          if (Test-Path -LiteralPath $nemoCertificate) { throw 'Signing path already exists.' }
          [IO.File]::WriteAllBytes($nemoCertificate, [Convert]::FromBase64String($env:SIGNING_PFX))
          "NEMO_SIGN_CERTIFICATE_FILE=$nemoCertificate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Sign owned application before packaging and final installer afterwards
        env:
          NEMO_REQUIRE_SIGNING: '1'
          NEMO_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.NEMO_SIGNING_PASSWORD }}
          NEMO_SIGN_EXPECTED_THUMBPRINT: ${{ vars.NEMO_SIGN_EXPECTED_THUMBPRINT }}
        run: npm run desktop:make
      - name: Verify final trusted publisher, timestamp and delivered bytes
        env:
          EXPECTED_THUMBPRINT: ${{ vars.NEMO_SIGN_EXPECTED_THUMBPRINT }}
        run: ./scripts/verify-windows-candidate.ps1 -AppDirectory out/Nemo-win32-x64 -Installer out/make/squirrel.windows/x64/NemoSetup.exe -ExpectedThumbprint $env:EXPECTED_THUMBPRINT -Output .work/candidate/signatures.json
      - name: Store immutable unpublished draft; clean-PC acceptance remains pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEMO_REQUIRE_SIGNING: '1'
          NEMO_SIGN_EXPECTED_THUMBPRINT: ${{ vars.NEMO_SIGN_EXPECTED_THUMBPRINT }}
        run: node scripts/store-candidate.mjs
      - name: Remove this job's temporary signing file
        if: always()
        run: |
          if ($env:NEMO_SIGN_CERTIFICATE_FILE) {
            $nemoExpected = Join-Path $env:RUNNER_TEMP ('nemo-signing-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '.pfx')
            if ([IO.Path]::GetFullPath($env:NEMO_SIGN_CERTIFICATE_FILE) -ne [IO.Path]::GetFullPath($nemoExpected)) { throw 'Unexpected signing cleanup path.' }
            Remove-Item -LiteralPath $nemoExpected -Force -ErrorAction SilentlyContinue
          }

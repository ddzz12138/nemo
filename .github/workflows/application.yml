name: Verify Nemo application source

on:
  pull_request:
    paths: ['app/**', '.github/workflows/application.yml']
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/application.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nemo-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
      - name: Install locked build inputs without dependency lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install and build the maintained interface
        run: |
          npm ci --prefix desktop/interface --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run desktop:interface:build
      - name: Bootstrap the locked Electron runtime explicitly
        run: npm run desktop:bootstrap
      - name: Check source inventory and syntax
        run: |
          npm run check:source -- --tracked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run check
      - name: Run source and native regression tests
        env:
          NEMO_TEST_PYTHON: python
        run: |
          New-Item -ItemType Directory -Path .work -Force | Out-Null
          npm test
      - name: Verify CLI archive after frontend installation
        run: npm run package:release
      # This read-only source job does not build/sign/upload an installer. Hermes
      # bundle execution and non-skippable release gates belong to the separate
      # trusted candidate workflow; source-job success is not pilot readiness.
